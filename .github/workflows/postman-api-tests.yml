name: Run Postman API Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman and HTML Extra reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman with HTML Extra report
        run: |
          newman run "Books API Collection_Naorin.json" \
            -e "Books Collection Env_Naorin.json" \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/newman-report.html \
            --reporter-htmlextra-title "Books API Test Report" \
            --reporter-htmlextra-darkTheme \
            --reporter-htmlextra-showEnvironmentData

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: newman/newman-report.html
          if-no-files-found: warn